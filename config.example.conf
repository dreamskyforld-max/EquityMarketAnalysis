# 项目配置文件模板 —— 复制为 config.conf 并填写真实值
# 注意：config.conf 不传 GitHub（见 .gitignore）

[database]
host = localhost
port = 5432
dbname = market_db
user = YOUR_DB_USER
password = YOUR_DB_PASSWORD

[futu]
host = 127.0.0.1
port = 11111

[ticker]
stocks = HK.00700,SH.600900,SH.520900,SH.600941,HK.09660
buffer_size = 500
flush_interval_seconds = 10
reconnect_delay_seconds = 30

[fred]
api_key = YOUR_FRED_API_KEY

[wecom]
bot_a_id = YOUR_WECOM_BOT_A_ID
bot_a_secret = YOUR_WECOM_BOT_A_SECRET
bot_b_id = YOUR_WECOM_BOT_B_ID
bot_b_secret = YOUR_WECOM_BOT_B_SECRET

[wecom_webhook]
key = YOUR_WECOM_WEBHOOK_KEY

[sync_server]
host = YOUR_SYNC_SERVER_HOST
user = root
password = YOUR_SYNC_SERVER_PASSWORD
